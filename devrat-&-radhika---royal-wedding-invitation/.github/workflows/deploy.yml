
name: Deploy Wedding Website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: devrat-&-radhika---royal-wedding-invitation
        run: npm install

      - name: Build website
        working-directory: devrat-&-radhika---royal-wedding-invitation
        run: npm run build

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: devrat-&-radhika---royal-wedding-invitation/dist

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
